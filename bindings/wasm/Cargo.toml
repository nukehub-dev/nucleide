[package]
name = "nucleide-wasm"
description = "wasm-bindgen facade exposing Nucleide core capabilities to the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "nucleide_wasm"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
flate2 = "1"
serde = { workspace = true }
serde_json = { workspace = true }

# Workspace crates — keep Rayon disabled so this builds for wasm32-unknown-unknown.
nucleide-nuclei.workspace = true
nucleide-material.workspace = true
nucleide-emit.workspace = true
nucleide-enrichment.workspace = true
nucleide-depletion = { workspace = true, default-features = false }
nucleide-mcnp-io.workspace = true
nucleide-mcpl-io.workspace = true
nucleide-kinetics.workspace = true
nucleide-spectroscopy.workspace = true
nucleide-alara-io.workspace = true
nucleide-cccc-io.workspace = true
nucleide-fispact-io.workspace = true
nucleide-serpent-io.workspace = true
nucleide-fluka-io.workspace = true
nucleide-origen-io.workspace = true
nucleide-vr-tools.workspace = true
nucleide-linalg = { workspace = true, default-features = false }

[features]
default = []

[package.metadata.wasm-pack.profile.release]
# The bundled wasm-opt does not enable bulk-memory by default, but recent Rust
# can emit bulk-memory ops. Disable optimization for now; the module still runs.
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
