name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish_crates:
        description: 'Publish Rust crates to crates.io (dry-run if false)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python tooling
        run: pip install maturin pytest pytest-cov ruff mypy

      - name: Build and install Python extension
        run: maturin develop

      - name: Check Python formatting and lint
        run: ruff format --check python tests && ruff check python tests

      - name: Type-check Python
        run: mypy

      - name: Run Python tests
        run: pytest tests/ -v

  wheels:
    name: Build and publish wheels
    needs: verify
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and publish wheels
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --non-interactive --skip-existing --out dist

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: warn

  crates:
    name: Publish Rust crates
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Dry-run publish workspace crates
        run: |
          for crate in linalg nuclei material mcnp-io serpent-io fluka-io enrichment depletion vr-tools nucleide-bindings; do
            echo "--- cargo publish --dry-run -p $crate ---"
            cargo publish --dry-run -p "$crate"
          done

      - name: Publish workspace crates
        if: github.event_name == 'workflow_dispatch' && inputs.publish_crates
        run: |
          for crate in linalg nuclei material mcnp-io serpent-io fluka-io enrichment depletion vr-tools nucleide-bindings; do
            echo "--- cargo publish -p $crate ---"
            cargo publish -p "$crate"
          done

  github-release:
    name: Create GitHub release
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No curated CHANGELOG.md section found for $VERSION — see the commit log." > release-notes.md
          fi
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
