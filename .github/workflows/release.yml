name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python tooling
        run: pip install maturin pytest pytest-cov ruff mypy numpy

      - name: Build and install Python extension
        run: |
          maturin build
          pip install --no-index --find-links target/wheels nucleide

      - name: Check Python formatting and lint
        run: ruff format --check python tests && ruff check python tests

      - name: Type-check Python
        run: mypy

      - name: Run Python tests
        run: pytest tests/ -v

  wheels:
    name: Build wheels
    needs: verify
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        # abi3 produces one wheel per OS for all Python >= 3.10, so a single
        # interpreter per OS is enough; every leg used to publish the same
        # filenames and race each other on upload.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish wheels to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build sdist and publish once
        # Single uploader: every wheel filename is identical across
        # interpreters (abi3), so publishing from each matrix leg raced on
        # the same PyPI files and sporadically failed with 500s.
        run: |
          maturin sdist --out dist
          maturin upload --non-interactive --skip-existing dist/*

      - name: Upload published dist
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*
          if-no-files-found: error

  crates:
    name: Publish Rust crates
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates
        run: |
          set -euo pipefail
          # Dependency order: every crate appears only after its workspace
          # dependencies. `nucleide-wasm` is deliberately absent (cdylib-only
          # browser artifact, never published to crates.io).
          publish_list="nucleide-linalg nucleide-nuclei nucleide-material nucleide-mcnp-io nucleide-mcpl-io nucleide-serpent-io nucleide-fluka-io nucleide-enrichment nucleide-depletion nucleide-kinetics nucleide-spectroscopy nucleide-vr-tools nucleide-alara-io nucleide-cccc-io nucleide-fispact-io nucleide-origen-io nucleide-r2s nucleide-emit nucleide-bindings"
          # Fail fast if a publishable workspace member is missing from the
          # list: `cargo publish` reports that as "no matching package named",
          # which the retry loop below would otherwise mistake for
          # registry-index lag and retry for an hour.
          missing=0
          members=$(sed -n '/^members = \[/,/^\]/p' Cargo.toml | sed -n 's/^ *"\([^"]*\)".*/\1/p')
          for member in $members; do
            name=$(sed -n 's/^name = "\([^"]*\)".*/\1/p' "$member/Cargo.toml" | head -n 1)
            case "$name" in
              nucleide-wasm) continue ;;
            esac
            case " $publish_list " in
              *" $name "*) ;;
              *)
                echo "error: workspace member $name ($member) missing from release publish list"
                missing=1
                ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          for crate in $publish_list; do
            echo "--- cargo publish -p $crate ---"
            attempt=1
            while true; do
              if out=$(cargo publish -p "$crate" 2>&1); then
                echo "$out"
                break
              fi
              echo "$out"
              # Re-runs must tolerate crates published by an earlier attempt.
              # crates.io failures are retried: 429s carry an exact retry
              # timestamp (leaky bucket — adapts to either limit); a missing
              # dependency right after publishing siblings is registry-index
              # lag (verified 0.4.0: alara-io present, r2s resolution lagged).
              case "$out" in
                *"already uploaded"*|*"already been uploaded"*|*"already exists"*)
                  echo "$crate already published; continuing."
                  break
                  ;;
                *"429"*|*"Too Many Requests"*|*"no matching package named"*)
                  if [ "$attempt" -ge 12 ]; then
                    echo "still failing after $attempt attempts; giving up."
                    exit 1
                  fi
                  wait_for=660
                  if [[ "$out" == *"429"* ]]; then
                    retry_at=$(echo "$out" | grep -oE '[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT' | head -n 1 || true)
                    if [ -n "$retry_at" ] && epoch=$(date -d "$retry_at" +%s 2>/dev/null); then
                      wait_for=$((epoch - $(date +%s) + 30))
                      if [ "$wait_for" -lt 60 ]; then wait_for=60; fi
                    fi
                  else
                    wait_for=300
                  fi
                  echo "registry not ready; waiting ${wait_for}s (attempt $attempt/12)."
                  sleep "$wait_for"
                  attempt=$((attempt + 1))
                  ;;
                *)
                  exit 1
                  ;;
              esac
            done
          done

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download published dist
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: artifacts

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No curated CHANGELOG.md section found for $VERSION — see the commit log." > release-notes.md
          fi
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
