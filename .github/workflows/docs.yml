name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/**'
      - 'python/**'
      - 'crates/**'
      - 'bindings/**'
      - 'fixtures/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/**'
      - 'python/**'
      - 'crates/**'
      - 'bindings/**'
      - 'fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'
          config: '.markdownlint-cli2.jsonc'

  links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        # GITHUB_TOKEN makes lychee check github.com links via the API instead
        # of scraping HTML, avoiding transient 503 rate-limit failures.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --accept '200..=299,403,429'
            --timeout 30
            --max-retries 3
            --retry-wait-time 5
            --root-dir 'docs'
            --exclude-path 'target'
            --exclude-path '.mypy_cache'
            --exclude-path '.pytest_cache'
            --exclude-path '.ruff_cache'
            --exclude-path '__pycache__'
            --exclude-path 'node_modules'
            -- '*.md' 'docs/**/*.md' 'docs/**/*.mdx'
          fail: true

  reference-freshness:
    name: Reference Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Check generated reference docs are fresh
        run: python3 scripts/gen-reference.py --check
