name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - '.markdownlint-cli2.jsonc'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - '.markdownlint-cli2.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'
          config: '.markdownlint-cli2.jsonc'

  links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --exclude-path 'target'
            --exclude-path '.mypy_cache'
            --exclude-path '.pytest_cache'
            --exclude-path '.ruff_cache'
            --exclude-path '__pycache__'
            --exclude-path 'node_modules'
            -- '*.md' 'docs/**/*.md'
          fail: true
