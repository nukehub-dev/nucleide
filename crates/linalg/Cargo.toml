[package]
name = "nucleide-linalg"
description = "Isolation facade over the numeric backend (faer) so the rest of the workspace never depends on it directly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["rayon"]
rayon = ["faer/rayon"]

[dependencies]
faer = { version = "0.20", default-features = false, features = ["std", "linalg"] }
num-complex = "0.4"
roxmltree = "0.20"
# Seeded RNG for the UQ-lite sampling kernel only. Default features are off
# so no OS-entropy (`getrandom`/`thread_rng`) path is pulled in: `StdRng`
# below is always built from a caller-supplied u64 seed, which keeps this
# crate compilable for wasm32-unknown-unknown (the wasm facade never calls
# these paths, but the crate must still build there).
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "small_rng"] }

[dev-dependencies]
criterion = "0.5"
serde_json.workspace = true

[[bench]]
name = "linalg_bench"
harness = false
