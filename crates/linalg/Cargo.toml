[package]
name = "linalg"
description = "Isolation facade over the numeric backend (planned: faer) so the rest of the workspace never depends on it directly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["rayon"]
rayon = ["faer/rayon"]

[dependencies]
faer = { version = "0.20", default-features = false, features = ["std", "linalg"] }
num-complex = "0.4"
roxmltree = "0.20"
# faer is intentionally NOT enabled yet.
