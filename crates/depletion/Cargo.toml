[package]
name = "nucleide-depletion"
description = "CRAM matrix exponential (orders 16/48), depletion-chain XML parsing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["rayon"]
rayon = ["nucleide-linalg/rayon"]

[dependencies]
nucleide-linalg = { workspace = true, default-features = false }
nucleide-nuclei.workspace = true
num-complex = "0.4"
roxmltree = "0.20"
serde_json.workspace = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "depletion_bench"
harness = false
