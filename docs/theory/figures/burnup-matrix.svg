<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="sans-serif">
  <title>One column of the burnup matrix: the diagonal loses the parent by decay and reactions; off-diagonal entries produce daughters</title>
  <defs>
    <marker id="bm-arrow-g" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#059669"/>
    </marker>
    <marker id="bm-arrow-a" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#d97706"/>
    </marker>
    <marker id="bm-arrow-p" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <text x="220" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">column j = parent nuclide</text>
  <text x="32" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" transform="rotate(-90 32 200)">row i = daughter nuclide</text>
  <rect x="192" y="58" width="56" height="264" rx="8" fill="var(--muted)"/>
  <g stroke="var(--muted-foreground)" stroke-width="1">
    <path d="M90 60 h260 M90 112 h260 M90 164 h260 M90 216 h260 M90 268 h260 M90 320 h260" fill="none"/>
    <path d="M90 60 v260 M142 60 v260 M194 60 v260 M246 60 v260 M298 60 v260 M350 60 v260" fill="none"/>
  </g>
  <rect x="194" y="112" width="52" height="52" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <rect x="194" y="164" width="52" height="52" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="194" y="216" width="52" height="52" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="194" y="268" width="52" height="52" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M 246 186 C 276 176, 276 148, 250 138" stroke="#059669" marker-end="url(#bm-arrow-g)"/>
    <path d="M 246 198 C 290 208, 290 232, 250 240" stroke="#d97706" marker-end="url(#bm-arrow-a)"/>
    <path d="M 246 208 C 302 228, 302 282, 250 292" stroke="#7c3aed" marker-end="url(#bm-arrow-p)"/>
  </g>
  <g font-size="13" fill="currentColor">
    <rect x="400" y="86" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.25"/>
    <text x="430" y="101">diagonal A&#x1d62;&#x1d62;: &#x2212;&#x3bb;&#x1d62; &#x2212; &#x3c3;&#x3c6; (loss)</text>
    <rect x="400" y="128" width="20" height="20" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.25"/>
    <text x="430" y="143">A&#x2c7c;&#x1d62; += &#x3bb;&#x1d62;&#x2009;b&#x1d62;&#x2192;&#x2c7c; (decay branch)</text>
    <rect x="400" y="170" width="20" height="20" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.25"/>
    <text x="430" y="185">A&#x2c7c;&#x1d62; += &#x3c3;&#x3c6;&#x2009;b (reaction, e.g. (n,&#x3b3;))</text>
    <rect x="400" y="212" width="20" height="20" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.25"/>
    <text x="430" y="227">A&#x2096;&#x1d62; += &#x3c3;&#x3c6;&#x2009;y&#x1d62;&#x2192;&#x2096; (fission yield)</text>
  </g>
  <text x="220" y="356" text-anchor="middle" font-size="12.5" font-style="italic" fill="var(--muted-foreground)">sparse, units s&#x207b;&#xb9;; one diagonal entry per chain nuclide</text>
</svg>
