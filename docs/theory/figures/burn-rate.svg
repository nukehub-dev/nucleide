<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="sans-serif">
  <title>Tritium burn rate versus fusion power: a straight line through the origin with slope K, marked at the Point-A anchor</title>
  <desc>burn = P_fusion times K with K = 0.153454 g/day per MW; the Point-A anchor at 2714.82 MW burns 416.6 g/day</desc>
  <!-- grid -->
  <line x1="90.0" y1="330.0" x2="610.0" y2="330.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="90.0" y1="272.0" x2="610.0" y2="272.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="90.0" y1="214.0" x2="610.0" y2="214.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="90.0" y1="156.0" x2="610.0" y2="156.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="90.0" y1="98.0" x2="610.0" y2="98.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="90.0" y1="40.0" x2="610.0" y2="40.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="220.0" y1="40.0" x2="220.0" y2="330.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="350.0" y1="40.0" x2="350.0" y2="330.0" stroke="var(--muted)" stroke-width="1"/>
  <line x1="480.0" y1="40.0" x2="480.0" y2="330.0" stroke="var(--muted)" stroke-width="1"/>
  <!-- Point-A burn guide -->
  <line x1="90.0" y1="88.4" x2="610.0" y2="88.4" stroke="#d97706" stroke-width="1.25" stroke-dasharray="7 4"/>
  <!-- burn line: y = 0.153454 x -->
  <polyline points="90.0,330.0 610.0,63.0" fill="none" stroke="#2563eb" stroke-width="2.75"/>
  <circle cx="90.0" cy="330.0" r="4.5" fill="#2563eb"/>
  <!-- Point-A anchor -->
  <circle cx="560.6" cy="88.4" r="5" fill="#d97706"/>
  <!-- anchor callout -->
  <rect x="110" y="58" width="196" height="46" rx="10" fill="#fef3c7"/>
  <text x="208" y="77" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">Point-A anchor (gate, not input)</text>
  <text x="208" y="95" text-anchor="middle" font-size="11.5" fill="#b45309">2714.82 MW &#x2192; 416.6 g/day</text>
  <!-- axes -->
  <line x1="90.0" y1="330.0" x2="610.0" y2="330.0" stroke="var(--muted-foreground)" stroke-width="1.5"/>
  <line x1="90.0" y1="330.0" x2="90.0" y2="40.0" stroke="var(--muted-foreground)" stroke-width="1.5"/>
  <text x="90.0" y="350.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">0</text>
  <text x="220.0" y="350.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">750</text>
  <text x="350.0" y="350.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">1500</text>
  <text x="480.0" y="350.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">2250</text>
  <text x="610.0" y="350.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">3000</text>
  <text x="80.0" y="334.0" text-anchor="end" font-size="12" fill="var(--muted-foreground)">0</text>
  <text x="80.0" y="276.0" text-anchor="end" font-size="12" fill="var(--muted-foreground)">100</text>
  <text x="80.0" y="218.0" text-anchor="end" font-size="12" fill="var(--muted-foreground)">200</text>
  <text x="80.0" y="160.0" text-anchor="end" font-size="12" fill="var(--muted-foreground)">300</text>
  <text x="80.0" y="102.0" text-anchor="end" font-size="12" fill="var(--muted-foreground)">400</text>
  <text x="80.0" y="44.0" text-anchor="end" font-size="12" fill="var(--muted-foreground)">500</text>
  <text x="350.0" y="372.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--muted-foreground)">fusion power P_fusion [MW]</text>
  <text x="22" y="185.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--muted-foreground)" transform="rotate(-90 22 185.0)">burn [g/day]</text>
  <text x="490.0" y="200.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">burn = P_fusion &#xb7; K, K = 0.153454</text>
</svg>
