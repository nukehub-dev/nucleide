<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" font-family="sans-serif">
  <title>Wall-load mapping: radial birth-rate voxels at one wall node accumulate into the wall flux</title>
  <desc>three radial cells with S, J, delta-s accumulate as q = sum S J delta-s = 3.0 at the wall node, the worked uniform-field example</desc>
  <defs>
    <marker id="wl-arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- radial cells -->
  <rect x="60" y="60" width="120" height="200" rx="10" fill="var(--muted)"/>
  <rect x="200" y="60" width="120" height="200" rx="10" fill="var(--muted)"/>
  <rect x="340" y="60" width="120" height="200" rx="10" fill="var(--muted)"/>
  <text x="120" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">cell 0</text>
  <text x="260" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">cell 1</text>
  <text x="400" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">cell 2</text>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">S = 2.0</text>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">S = 2.0</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">S = 2.0</text>
  <text x="120" y="152" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">J = 1.5</text>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">J = 1.5</text>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">J = 1.5</text>
  <text x="120" y="174" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">&#x394;s = 1/3</text>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">&#x394;s = 1/3</text>
  <text x="400" y="174" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">&#x394;s = 1/3</text>
  <text x="120" y="212" text-anchor="middle" font-size="12" fill="#2563eb">1.0</text>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#2563eb">1.0</text>
  <text x="400" y="212" text-anchor="middle" font-size="12" fill="#2563eb">1.0</text>
  <text x="120" y="234" text-anchor="middle" font-size="11.5" fill="var(--muted-foreground)">S&#xb7;J&#xb7;&#x394;s</text>
  <text x="260" y="234" text-anchor="middle" font-size="11.5" fill="var(--muted-foreground)">S&#xb7;J&#xb7;&#x394;s</text>
  <text x="400" y="234" text-anchor="middle" font-size="11.5" fill="var(--muted-foreground)">S&#xb7;J&#xb7;&#x394;s</text>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">radial voxels at one (&#x3b8;, &#x3b6;) node, s &#x2208; [0, 1]</text>
  <!-- accumulation arrow -->
  <line x1="470" y1="160" x2="520" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#wl-arrow)"/>
  <text x="495" y="145" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">&#x3a3; (W1)</text>
  <!-- wall node -->
  <rect x="530" y="110" width="80" height="100" rx="10" fill="#fef3c7"/>
  <text x="570" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">wall</text>
  <text x="570" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">node</text>
  <text x="570" y="182" text-anchor="middle" font-size="12" fill="#b45309">q = 3.0</text>
  <text x="570" y="240" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">per (&#x3b8;, &#x3b6;)</text>
  <text x="570" y="300" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">Q = &#x3a3; q &#x394;&#x3b8;&#x394;&#x3b6; (W2)</text>
</svg>
