<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="sans-serif" color="#1c1917">
  <title>Walker alias table: each of the n unit-height columns holds its own bin up to prob and an alias bin above; one uniform picks the column, a second picks bin or alias</title>
  <defs>
    <filter id="at-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="at-arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#44403c"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafaf9"/>
  <text x="123" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#44403c">input PMF p&#x1d62;</text>
  <g stroke="#2563eb" stroke-width="1.25" fill="#dbeafe">
    <path d="M60 170 v-116 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 v116 Z"/>
    <path d="M94 170 v-87 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 v87 Z"/>
    <path d="M128 170 v-58 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 v58 Z"/>
    <path d="M162 170 v-29 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 v29 Z"/>
  </g>
  <g font-size="11.5" fill="#57534e" text-anchor="middle">
    <text x="72" y="186">0.4</text>
    <text x="106" y="186">0.3</text>
    <text x="140" y="186">0.2</text>
    <text x="174" y="186">0.1</text>
  </g>
  <line x1="216" y1="112" x2="296" y2="112" stroke="#44403c" stroke-width="2" marker-end="url(#at-arrow)"/>
  <text x="256" y="96" text-anchor="middle" font-size="12" fill="#57534e">scale by n,</text>
  <text x="256" y="138" text-anchor="middle" font-size="12" fill="#57534e">pair small + large</text>
  <text x="465" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#44403c">alias table (n = 4 unit columns)</text>
  <g filter="url(#at-soft)">
    <g>
      <rect x="330" y="60" width="60" height="150" rx="8" fill="#fde68a"/>
      <rect x="330" y="90" width="60" height="112" fill="#bfdbfe"/>
      <path d="M330 202 v-112 h60 v112 Z" fill="#bfdbfe"/>
      <rect x="330" y="60" width="60" height="150" rx="8" fill="none" stroke="#44403c" stroke-width="1.25"/>
    </g>
    <g>
      <rect x="410" y="60" width="60" height="150" rx="8" fill="#bfdbfe"/>
      <rect x="410" y="60" width="60" height="150" rx="8" fill="none" stroke="#44403c" stroke-width="1.25"/>
    </g>
    <g>
      <rect x="490" y="60" width="60" height="150" rx="8" fill="#fde68a"/>
      <path d="M490 202 v-112 h60 v112 Z" fill="#bfdbfe"/>
      <rect x="490" y="60" width="60" height="150" rx="8" fill="none" stroke="#44403c" stroke-width="1.25"/>
    </g>
    <g>
      <rect x="570" y="60" width="60" height="150" rx="8" fill="#fde68a"/>
      <path d="M570 202 v-52 h60 v52 Z" fill="#bfdbfe"/>
      <rect x="570" y="60" width="60" height="150" rx="8" fill="none" stroke="#44403c" stroke-width="1.25"/>
    </g>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="360" y="156" fill="#1e3a8a">bin 0</text>
    <text x="360" y="80" fill="#78350f">alias 1</text>
    <text x="440" y="140" fill="#1e3a8a">bin 1</text>
    <text x="520" y="156" fill="#1e3a8a">bin 2</text>
    <text x="520" y="80" fill="#78350f">alias 0</text>
    <text x="600" y="184" fill="#1e3a8a">bin 3</text>
    <text x="600" y="108" fill="#78350f">alias 0</text>
    <text x="360" y="230" fill="#57534e">prob 0.8</text>
    <text x="440" y="230" fill="#57534e">prob 1.0</text>
    <text x="520" y="230" fill="#57534e">prob 0.8</text>
    <text x="600" y="230" fill="#57534e">prob 0.4</text>
  </g>
  <rect x="60" y="262" width="570" height="104" rx="10" fill="#f5f5f4"/>
  <g font-size="13" fill="#292524">
    <text x="84" y="292" font-weight="700">sampling one index in O(1)</text>
    <circle cx="94" cy="316" r="9" fill="#2563eb"/>
    <text x="94" y="320.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
    <text x="112" y="321">draw r&#x2081;, r&#x2082; &#x2208; [0, 1); column i = &#x230a;n&#x2009;r&#x2081;&#x230b;</text>
    <circle cx="94" cy="344" r="9" fill="#2563eb"/>
    <text x="94" y="348.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
    <text x="112" y="349">return i if r&#x2082; &lt; prob[i], otherwise return alias[i]</text>
  </g>
</svg>
