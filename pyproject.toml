[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "Nucleide"
dynamic = ["version"]
description = "Modern Rust toolkit for nuclear-engineering workflow glue: legacy transport-code I/O, materials, depletion, enrichment analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nucleide developers" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]

[tool.maturin]
python-source = "python"
module-name = "nucleide._internal"
manifest-path = "bindings/python/Cargo.toml"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nucleide --cov=tests --cov-report=term-missing --cov-report=xml"

# --- ruff: formatter + linter for python/ and tests/ ---
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear (likely bugs)
    "SIM", # simplification
    "C4",  # comprehensions
]

[tool.mypy]
files = ["python/nucleide", "tests"]
python_version = "3.10"
strict = true
# The compiled _internal module is checked via its .pyi stub.
disallow_untyped_calls = true
# Local `stubs/` shadows site-packages NumPy, whose bundled stubs use
# Python 3.12+ `type`-statement syntax that mypy cannot parse under the
# 3.10 target above (fatal even with follow_imports=skip). The shadow
# declares only the names `_internal.pyi` needs, as opaque `Any`.
mypy_path = "stubs"

# Tests only use pytest.approx/raises; treat pytest (and numpy, which local
# pytest installs pull in and whose stubs require Python 3.12+ syntax) as
# opaque so `mypy` behaves the same in local envs and CI (which has no numpy).
# `result_array`/`totals_array` return `np.ndarray` (typed as opaque here).
[[tool.mypy.overrides]]
module = ["pytest", "_pytest", "_pytest.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["nucleide", "tests"]

[tool.coverage.report]
show_missing = true
